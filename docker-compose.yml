services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atip
      POSTGRES_PASSWORD: atip
      POSTGRES_DB: atip
    ports:
      - "5433:5432"
    volumes:
      - atip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atip"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://atip:atip@db:5432/atip
      BROKER_BACKEND: mock
    ports:
      - "2026:2026"
    depends_on:
      db:
        condition: service_healthy

volumes:
  atip_pgdata:
